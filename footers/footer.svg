<svg width="1000" height="50" viewBox="0 0 1000 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300&amp;display=swap');

      .text {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 300;
        font-size: 11px;
        fill: #484f58;
        text-anchor: middle;
        letter-spacing: 2px;
        opacity: 0;
        animation: fadeIn 1s ease 0.2s forwards;
      }

      .rule {
        stroke: #21262d;
        stroke-width: 0.5;
        stroke-dasharray: 60;
        stroke-dashoffset: 60;
        animation: draw 1.5s ease 0.1s forwards;
      }

      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1000" height="50" fill="#0d1117"/>
  <line x1="470" y1="14" x2="530" y2="14" class="rule"/>
  <text x="500" y="38" class="text">THANKS FOR STOPPING BY</text>
</svg>
