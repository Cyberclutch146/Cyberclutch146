<?xml version="1.0" encoding="utf-8"?>
<svg width="100%" viewBox="0 0 860 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');
      .win { fill: #030712; fill-opacity: 0.85; stroke: url(#gb); stroke-width: 1.5; }
      .grid { stroke: #00ffff22; stroke-width: 0.6; }
      .glow-cyan { fill: #00ffff; filter: url(#cyanGlow); }
      .glow-pink { fill: #ff4dd2; filter: url(#pinkGlow); }
      .t-title { font: 800 14px 'Outfit', system-ui, -apple-system, sans-serif; fill: #00ffff; letter-spacing: 4px; text-transform: uppercase; }
      .t-sub { font: 600 11px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #94a3b8; letter-spacing: 2px; }
      .t-name { font: 900 56px 'Outfit', system-ui, -apple-system, sans-serif; fill: #ffffff; letter-spacing: 1px; }
      .t-name-grad { font: 900 56px 'Outfit', system-ui, -apple-system, sans-serif; fill: url(#nameGrad); letter-spacing: 1px; }
      .t-role { font: 600 16px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #00ffff; letter-spacing: 6px; text-transform: uppercase; }
      .t-btn { font: 700 12px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #ffffff; letter-spacing: 2px; text-transform: uppercase; }
      .t-meta { font: 500 12px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #cbd5e1; }
      .t-meta-cyan { font: 600 12px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #00ffff; }
      .dot { fill: #00ffff; }
      .pill { fill: #0a1426; stroke: #00ffff77; stroke-width: 1; }
      .pill-text { font: 600 10px 'JetBrains Mono', Consolas, 'Courier New', monospace; fill: #00ffff; letter-spacing: 1px; }
    ]]></style>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff4dd2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#ff4dd2"/>
    </linearGradient>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="860" height="250" rx="16" fill="#020617"/>

  <!-- decorative grid -->
  <g class="grid">
    <line x1="0" y1="50" x2="860" y2="50"/>
    <line x1="0" y1="125" x2="860" y2="125"/>
    <line x1="0" y1="200" x2="860" y2="200"/>
    <line x1="215" y1="0" x2="215" y2="250"/>
    <line x1="430" y1="0" x2="430" y2="250"/>
    <line x1="645" y1="0" x2="645" y2="250"/>
  </g>

  <!-- title bar -->
  <rect x="20" y="20" width="820" height="38" rx="10" class="win"/>
  <circle cx="42" cy="39" r="6" fill="#ff5f56"/>
  <circle cx="62" cy="39" r="6" fill="#ffbd2e"/>
  <circle cx="82" cy="39" r="6" fill="#27c93f"/>
  <text x="120" y="44" class="t-sub">~/cyberclutch146 — system.boot — secure_shell@main</text>
  <text x="800" y="44" class="t-sub" text-anchor="end">? ONLINE</text>
  <circle cx="765" cy="39" r="4" class="dot"/>

  <!-- main glass window -->
  <rect x="20" y="68" width="820" height="162" rx="14" class="win"/>

  <!-- left rail -->
  <g transform="translate(40, 90)">
    <rect x="0" y="0" width="64" height="64" rx="14" fill="#020617" stroke="url(#gb)" stroke-width="1.5"/>
    <text x="32" y="44" text-anchor="middle" font-family="Outfit, sans-serif" font-weight="900" font-size="32" fill="url(#nameGrad)">C</text>
    <text x="32" y="92" text-anchor="middle" class="t-meta-cyan">@Cyberclutch146</text>
    <text x="32" y="108" text-anchor="middle" class="t-sub">v 2.0.26</text>
  </g>

  <!-- center name + role -->
  <g transform="translate(125, 88)">
    <text class="t-title">$ whoami</text>
    <text y="46" class="t-name">Swagata Ganguly</text>
    <text y="78" class="t-role">Full-Stack · Systems · Cyber</text>
    <g transform="translate(0, 96)">
      <rect class="pill" x="0" y="0" width="78" height="22" rx="11"/>
      <text class="pill-text" x="39" y="15" text-anchor="middle">REACT</text>
      <rect class="pill" x="86" y="0" width="92" height="22" rx="11"/>
      <text class="pill-text" x="132" y="15" text-anchor="middle">NEXT.JS</text>
      <rect class="pill" x="186" y="0" width="86" height="22" rx="11"/>
      <text class="pill-text" x="229" y="15" text-anchor="middle">NODE</text>
      <rect class="pill" x="280" y="0" width="108" height="22" rx="11"/>
      <text class="pill-text" x="334" y="15" text-anchor="middle">POSTGRESQL</text>
    </g>
  </g>

  <!-- right info -->
  <g transform="translate(640, 88)">
    <text class="t-title" x="180" y="0" text-anchor="end">UPTIME</text>
    <text class="t-name-grad" x="180" y="40" text-anchor="end">1y+</text>
    <text class="t-meta" x="180" y="64" text-anchor="end">Since Oct 2024</text>
    <line x1="60" y1="80" x2="180" y2="80" stroke="#00ffff55" stroke-width="1"/>
    <text class="t-meta" x="60" y="100">LOCATION</text>
    <text class="t-meta-cyan" x="180" y="100" text-anchor="end">IN · IST</text>
    <text class="t-meta" x="60" y="120">STATUS</text>
    <text class="t-meta-cyan" x="180" y="120" text-anchor="end">? SHIPPING</text>
  </g>

  <!-- corner accents -->
  <path d="M20 68 L20 50 Q20 38 32 38 L50 38" stroke="#00ffff" stroke-width="2" fill="none"/>
  <path d="M840 68 L840 50 Q840 38 828 38 L810 38" stroke="#ff4dd2" stroke-width="2" fill="none"/>
</svg>
