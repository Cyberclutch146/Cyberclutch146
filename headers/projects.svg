<svg width="100%" viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
      .win { fill: #030712; fill-opacity: 0.85; stroke: url(#gb); stroke-width: 1.5; }
      .title { font: 800 13px 'Outfit', sans-serif; fill: #00ffff; letter-spacing: 3px; text-transform: uppercase; }
      .sub { font: 500 11px 'JetBrains Mono', monospace; fill: #64748b; letter-spacing: 2px; text-transform: uppercase; }
      .card { fill: #020617; stroke: #1e293b; stroke-width: 1; }
      .card-cyan { fill: #020617; stroke: #00ffff77; stroke-width: 1.2; }
      .name { font: 700 14px 'Outfit', sans-serif; fill: #ffffff; }
      .desc { font: 500 11px 'JetBrains Mono', monospace; fill: #94a3b8; }
      .pill { fill: #0a1426; stroke: #00ffff55; stroke-width: 1; }
      .pill-text { font: 600 9px 'JetBrains Mono', monospace; fill: #00ffff; letter-spacing: 1px; }
      .stat-num { font: 800 18px 'Outfit', sans-serif; fill: #ff4dd2; }
      .stat-lbl { font: 500 9px 'JetBrains Mono', monospace; fill: #64748b; letter-spacing: 1px; text-transform: uppercase; }
      .arrow { font: 700 14px 'JetBrains Mono', monospace; fill: #00ffff; }
    ]]></style>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4dd2" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="860" height="300" rx="16" fill="#020617"/>

  <rect x="20" y="20" width="820" height="36" rx="10" class="win"/>
  <circle cx="42" cy="38" r="5" fill="#ff5f56"/>
  <circle cx="60" cy="38" r="5" fill="#ffbd2e"/>
  <circle cx="78" cy="38" r="5" fill="#27c93f"/>
  <text x="110" y="42" class="sub">~/projects — featured_repos — 2 pinned</text>
  <text x="810" y="42" class="sub" text-anchor="end">★ highlights</text>

  <!-- card 1 -->
  <g transform="translate(20, 70)">
    <rect class="card-cyan" width="410" height="210" rx="12"/>
    <text x="20" y="32" class="title">◉ Community-management</text>
    <text x="20" y="56" class="desc">Full-stack community platform with</text>
    <text x="20" y="72" class="desc">role-based access, posts &amp; realtime feed.</text>

    <g transform="translate(20, 100)">
      <rect class="pill" x="0"   y="0" width="58" height="20" rx="10"/>
      <text class="pill-text" x="29" y="14" text-anchor="middle">REACT</text>
      <rect class="pill" x="66"  y="0" width="68" height="20" rx="10"/>
      <text class="pill-text" x="100" y="14" text-anchor="middle">NEXT.JS</text>
      <rect class="pill" x="142" y="0" width="58" height="20" rx="10"/>
      <text class="pill-text" x="171" y="14" text-anchor="middle">NODE</text>
      <rect class="pill" x="208" y="0" width="82" height="20" rx="10"/>
      <text class="pill-text" x="249" y="14" text-anchor="middle">POSTGRES</text>
    </g>

    <line x1="20" y1="146" x2="390" y2="146" stroke="#1e293b"/>
    <g transform="translate(20, 160)">
      <text class="stat-num" x="0" y="14">★ 1</text>
      <text class="stat-lbl" x="0" y="32">stars</text>
      <text class="stat-num" x="100" y="14">⑂ 0</text>
      <text class="stat-lbl" x="100" y="32">forks</text>
      <text class="arrow" x="350" y="18" text-anchor="end">→ open</text>
    </g>
  </g>

  <!-- card 2 -->
  <g transform="translate(440, 70)">
    <rect class="card" width="400" height="210" rx="12"/>
    <text x="20" y="32" class="title">◉ flux-whiteboard</text>
    <text x="20" y="56" class="desc">Real-time collaborative whiteboard with</text>
    <text x="20" y="72" class="desc">cursors, shapes, and live sync via websockets.</text>

    <g transform="translate(20, 100)">
      <rect class="pill" x="0"   y="0" width="58" height="20" rx="10"/>
      <text class="pill-text" x="29" y="14" text-anchor="middle">REACT</text>
      <rect class="pill" x="66"  y="0" width="68" height="20" rx="10"/>
      <text class="pill-text" x="100" y="14" text-anchor="middle">TYPESCRIPT</text>
      <rect class="pill" x="142" y="0" width="60" height="20" rx="10"/>
      <text class="pill-text" x="172" y="14" text-anchor="middle">SOCKET</text>
      <rect class="pill" x="210" y="0" width="60" height="20" rx="10"/>
      <text class="pill-text" x="240" y="14" text-anchor="middle">CANVAS</text>
    </g>

    <line x1="20" y1="146" x2="380" y2="146" stroke="#1e293b"/>
    <g transform="translate(20, 160)">
      <text class="stat-num" x="0" y="14">★ 0</text>
      <text class="stat-lbl" x="0" y="32">stars</text>
      <text class="stat-num" x="100" y="14">⑂ 0</text>
      <text class="stat-lbl" x="100" y="32">forks</text>
      <text class="arrow" x="360" y="18" text-anchor="end">→ open</text>
    </g>
  </g>
</svg>
