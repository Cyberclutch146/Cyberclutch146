<svg width="1000" height="180" viewBox="0 0 1000 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&amp;display=swap');

      .name {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 700;
        font-size: 44px;
        fill: url(#textFill);
        text-anchor: middle;
        opacity: 0;
        animation: rise 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
      }

      .role {
        font-family: 'Inter', -apple-system, sans-serif;
        font-weight: 300;
        font-size: 14px;
        fill: #8b949e;
        text-anchor: middle;
        letter-spacing: 5px;
        opacity: 0;
        animation: rise 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
      }

      .dot {
        fill: #8b949e;
        opacity: 0;
        animation: rise 1s ease 0.7s forwards;
      }

      .rule {
        stroke: #21262d;
        stroke-width: 0.5;
        stroke-dasharray: 140;
        stroke-dashoffset: 140;
        animation: draw 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
      }

      @keyframes rise {
        from { opacity: 0; transform: translateY(12px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }
    </style>

    <linearGradient id="textFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#c9d1d9"/>
    </linearGradient>

    <radialGradient id="ambient" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%"   stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </radialGradient>
  </defs>

  <!-- Background with subtle center vignette -->
  <rect width="1000" height="180" fill="url(#ambient)"/>

  <!-- Content -->
  <text x="500" y="82" class="name">Swagata Ganguly</text>

  <line x1="430" y1="100" x2="570" y2="100" class="rule"/>

  <text x="500" y="130" class="role">
    <tspan>FULL-STACK DEVELOPER</tspan>
  </text>

  <!-- Three subtle dots — visual punctuation -->
  <circle cx="490" cy="155" r="1.5" class="dot"/>
  <circle cx="500" cy="155" r="1.5" class="dot"/>
  <circle cx="510" cy="155" r="1.5" class="dot"/>
</svg>
