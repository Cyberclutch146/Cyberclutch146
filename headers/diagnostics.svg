<svg width="100%" viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&family=JetBrains+Mono:wght@400;600;700&display=swap');
      .win { fill: #030712; fill-opacity: 0.85; stroke: url(#gb); stroke-width: 1.5; }
      .grid { stroke: #00ffff18; stroke-width: 0.6; }
      .title { font: 800 13px 'Outfit', sans-serif; fill: #00ffff; letter-spacing: 3px; text-transform: uppercase; }
      .sub { font: 500 11px 'JetBrains Mono', monospace; fill: #64748b; letter-spacing: 2px; text-transform: uppercase; }
      .num { font: 900 44px 'Outfit', sans-serif; fill: #ffffff; }
      .num-cyan { font: 900 44px 'Outfit', sans-serif; fill: #00ffff; }
      .num-pink { font: 900 44px 'Outfit', sans-serif; fill: #ff4dd2; }
      .lbl { font: 600 11px 'JetBrains Mono', monospace; fill: #94a3b8; letter-spacing: 2px; text-transform: uppercase; }
      .meta { font: 500 11px 'JetBrains Mono', monospace; fill: #cbd5e1; }
      .bar { fill: #0a1426; stroke: #1e293b; stroke-width: 1; }
      .bar-fill { fill: url(#barGrad); }
      .bar-fill-pink { fill: url(#barGradPink); }
      .log { font: 500 11px 'JetBrains Mono', monospace; fill: #cbd5e1; }
      .log-cyan { font: 600 11px 'JetBrains Mono', monospace; fill: #00ffff; }
      .log-pink { font: 600 11px 'JetBrains Mono', monospace; fill: #ff4dd2; }
      .log-mute { font: 500 11px 'JetBrains Mono', monospace; fill: #475569; }
      .dot-cyan { fill: #00ffff; }
      .dot-pink { fill: #ff4dd2; }
      .dot-green { fill: #34d399; }
    ]]></style>
    <linearGradient id="gb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4dd2" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="barGradPink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4dd2"/>
      <stop offset="1" stop-color="#ff8ad8"/>
    </linearGradient>
  </defs>

  <rect width="860" height="360" rx="16" fill="#020617"/>
  <g class="grid">
    <line x1="0" y1="60" x2="860" y2="60"/>
    <line x1="0" y1="180" x2="860" y2="180"/>
    <line x1="0" y1="300" x2="860" y2="300"/>
    <line x1="280" y1="60" x2="280" y2="360"/>
    <line x1="560" y1="60" x2="560" y2="360"/>
  </g>

  <!-- header -->
  <rect x="20" y="20" width="820" height="36" rx="10" class="win"/>
  <circle cx="42" cy="38" r="5" class="dot-pink"/>
  <circle cx="60" cy="38" r="5" class="dot-cyan"/>
  <circle cx="78" cy="38" r="5" class="dot-green"/>
  <text x="110" y="42" class="sub">system.diagnostics — live_metrics.json</text>
  <text x="810" y="42" class="sub" text-anchor="end">↻ REALTIME</text>

  <!-- top row: 3 stat cards -->
  <g transform="translate(20, 70)">
    <rect width="260" height="100" rx="12" class="win"/>
    <text x="20" y="28" class="title">REPOSITORIES</text>
    <text x="20" y="74" class="num-cyan">21</text>
    <text x="20" y="92" class="lbl">Total public repos</text>
    <circle cx="240" cy="30" r="4" class="dot-cyan"/>
  </g>
  <g transform="translate(300, 70)">
    <rect width="260" height="100" rx="12" class="win"/>
    <text x="20" y="28" class="title">FOLLOWERS</text>
    <text x="20" y="74" class="num">11</text>
    <text x="20" y="92" class="lbl">+ growing network</text>
    <circle cx="240" cy="30" r="4" class="dot-pink"/>
  </g>
  <g transform="translate(580, 70)">
    <rect width="260" height="100" rx="12" class="win"/>
    <text x="20" y="28" class="title">STARS EARNED</text>
    <text x="20" y="74" class="num-pink">7</text>
    <text x="20" y="92" class="lbl">across all repositories</text>
    <circle cx="240" cy="30" r="4" class="dot-pink"/>
  </g>

  <!-- middle row: language distribution bars -->
  <g transform="translate(20, 190)">
    <rect width="540" height="160" rx="12" class="win"/>
    <text x="20" y="28" class="title">STACK_DISTRIBUTION</text>
    <text x="520" y="28" class="sub" text-anchor="end">auto-updated</text>

    <g transform="translate(20, 50)">
      <text class="meta" y="0">TypeScript</text>
      <rect class="bar" x="120" y="-10" width="380" height="12" rx="6"/>
      <rect class="bar-fill" x="120" y="-10" width="304" height="12" rx="6"/>
      <text class="log-cyan" x="510" y="0">80%</text>
    </g>
    <g transform="translate(20, 78)">
      <text class="meta" y="0">JavaScript</text>
      <rect class="bar" x="120" y="-10" width="380" height="12" rx="6"/>
      <rect class="bar-fill" x="120" y="-10" width="76" height="12" rx="6"/>
      <text class="log-cyan" x="510" y="0">20%</text>
    </g>
    <g transform="translate(20, 106)">
      <text class="meta" y="0">C++</text>
      <rect class="bar" x="120" y="-10" width="380" height="12" rx="6"/>
      <rect class="bar-fill-pink" x="120" y="-10" width="38" height="12" rx="6"/>
      <text class="log-pink" x="510" y="0">10%</text>
    </g>
    <g transform="translate(20, 134)">
      <text class="meta" y="0">Python</text>
      <rect class="bar" x="120" y="-10" width="380" height="12" rx="6"/>
      <rect class="bar-fill" x="120" y="-10" width="26" height="12" rx="6"/>
      <text class="log-cyan" x="510" y="0">7%</text>
    </g>
  </g>

  <!-- right panel: system log -->
  <g transform="translate(580, 190)">
    <rect width="260" height="160" rx="12" class="win"/>
    <text x="20" y="28" class="title">SYSTEM_LOG</text>
    <text x="20" y="56" class="log-mute">[init]</text>
    <text x="80" y="56" class="log">session open</text>
    <text x="20" y="76" class="log-cyan">[auth]</text>
    <text x="80" y="76" class="log">token ok</text>
    <text x="20" y="96" class="log-pink">[build]</text>
    <text x="80" y="96" class="log">compile success</text>
    <text x="20" y="116" class="log-cyan">[deploy]</text>
    <text x="80" y="116" class="log">edge push ok</text>
    <text x="20" y="136" class="log-pink">[meta]</text>
    <text x="80" y="136" class="log">all systems</text>
    <text x="20" y="150" class="log-cyan">— ready_</text>
  </g>
</svg>
