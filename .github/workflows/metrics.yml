name: Generate Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub metrics SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Cyberclutch146
          filename: github-metrics.svg
          template: classic
          base: ""
          config_timezone: Asia/Kolkata
          config_theme: tokyonight
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          extras_css: |
            svg path[fill="#9be9a8"], svg path[fill="#40c463"], svg path[fill="#30a14e"], svg path[fill="#216e39"] { fill: #00FFFF !important; }
            svg path[fill="#0e4429"], svg path[fill="#006d32"], svg path[fill="#26a641"], svg path[fill="#39d353"] { fill: #00FFFF !important; }
